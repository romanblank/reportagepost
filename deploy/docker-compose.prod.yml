# Прод-compose (лежит на VM в /opt/reportagepost). Инварианты Verifi:
# healthcheck + limits + restart на каждом сервисе; запуск только с --env-file.
services:
  app:
    container_name: reportagepost
    image: ${IMAGE:?set IMAGE to ghcr tag}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.prod
    # Ротация логов (deep-think Ops P1): диск 30GB, инцидент no-space-left 2026-07-13.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "1.5"
