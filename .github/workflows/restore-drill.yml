# Проверка ВОССТАНОВЛЕНИЯ из ночного бэкапа (аудит 2026-07-31, P0).
# «Бэкап без проверенного restore = не бэкап» — до этого workflow ни один дамп
# ни разу не разворачивался, т.е. надёжность бэкапов была предположением.
#
# Что делает: берёт САМЫЙ СВЕЖИЙ дамп из S3, поднимает одноразовый PostgreSQL
# в контейнере на VM (порт не публикуется, том временный), разворачивает дамп,
# считает строки ключевых таблиц и сверяет с боевой БД. Прод не трогает вообще:
# только читает из него count() и пишет во временный контейнер.
#
# Раз в неделю + вручную. Провал → Telegram-алерт.
name: Restore drill

on:
  schedule:
    - cron: "0 3 * * 1" # понедельник 03:00 UTC (после ночного бэкапа)
  workflow_dispatch: {}

concurrency:
  group: restore-drill
  cancel-in-progress: false

jobs:
  drill:
    runs-on: ubuntu-latest
    steps:
      - name: Развернуть последний дамп во временный PG и сверить
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            cd /opt/reportagepost
            export $(grep -E '^(DATABASE_URL|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|S3_ENDPOINT|S3_BUCKET)=' .env.prod | xargs -d '\n')

            aws() {
              docker run --rm -v /opt/reportagepost:/work \
                -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" \
                amazon/aws-cli --endpoint-url "$S3_ENDPOINT" "$@"
            }

            LATEST=$(aws s3 ls "s3://${S3_BUCKET}/db-backups/" | sort | tail -1 | awk '{print $4}')
            [ -n "$LATEST" ] || { echo "❌ в бакете нет ни одного дампа"; exit 1; }
            echo "Проверяем восстановление из: $LATEST"

            # Свежесть: дамп старше 48 часов = ночной бэкап давно не отрабатывает
            AGE_H=$(( ( $(date -u +%s) - $(date -u -d "$(echo "$LATEST" | sed -E 's/rp-db-([0-9]{8})-([0-9]{2})([0-9]{2})([0-9]{2})\.sql\.gz/\1 \2:\3:\4/')" +%s) ) / 3600 ))
            echo "Возраст дампа: ${AGE_H} ч"
            [ "$AGE_H" -le 48 ] || { echo "❌ последний дамп старше 48ч — бэкапы не идут"; exit 1; }

            aws s3 cp "s3://${S3_BUCKET}/db-backups/${LATEST}" "/work/${LATEST}"
            trap 'rm -f "/opt/reportagepost/${LATEST}"; docker rm -f rp-restore-test >/dev/null 2>&1 || true' EXIT

            # Одноразовый PG (порт наружу НЕ публикуем; том — внутри контейнера)
            docker rm -f rp-restore-test >/dev/null 2>&1 || true
            docker run -d --name rp-restore-test -e POSTGRES_PASSWORD=drill -e POSTGRES_DB=drill postgres:17 >/dev/null
            for i in $(seq 1 30); do
              docker exec rp-restore-test pg_isready -U postgres -d drill >/dev/null 2>&1 && break
              sleep 2
            done
            docker exec rp-restore-test pg_isready -U postgres -d drill >/dev/null || { echo "❌ временный PG не поднялся"; exit 1; }

            echo "Разворачиваем дамп…"
            zcat "/opt/reportagepost/${LATEST}" | docker exec -i rp-restore-test psql -U postgres -d drill -v ON_ERROR_STOP=1 -q

            q_restored() { docker exec rp-restore-test psql -U postgres -d drill -tAc "$1"; }
            # Боевые значения читаем через контейнер приложения (psql там нет — берём postgres-образ)
            q_prod() {
              docker run --rm postgres:17 psql "$(echo "$DATABASE_URL" | sed -E 's/sslmode=verify-full/sslmode=require/; s/&sslrootcert=[^&]*//; s/\?sslrootcert=[^&]*&/?/')" -tAc "$1"
            }

            FAIL=0
            for T in User PhotographerProfile Photo Inquiry Review; do
              R=$(q_restored "SELECT count(*) FROM public.\"$T\";" || echo "ERR")
              P=$(q_prod "SELECT count(*) FROM public.\"$T\";" || echo "ERR")
              echo "  $T: восстановлено=$R прод=$P"
              case "$R" in ''|*[!0-9]*) echo "  ❌ таблица $T не восстановилась"; FAIL=1; continue;; esac
              # Дамп ночной, прод живёт дальше → допускаем рост, но не потерю
              if [ "$P" != "ERR" ] && [ "$R" -gt "$P" ]; then echo "  ⚠️ в дампе больше строк, чем в проде (данные удалялись?)"; fi
              if [ "$T" = "User" ] && [ "$R" -eq 0 ]; then echo "  ❌ ни одного пользователя в восстановленной БД"; FAIL=1; fi
            done
            [ "$FAIL" -eq 0 ] || { echo "❌ RESTORE DRILL ПРОВАЛЕН"; exit 1; }
            echo "✅ Восстановление из ${LATEST} проверено успешно"

      - name: Telegram-алерт при провале учения
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          set -uo pipefail
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            curl -s -m 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=🔴 Reportage Post: RESTORE DRILL ПРОВАЛЕН — бэкапы могут быть непригодны. Лог: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
          fi
