# Ночной бэкап БД → Object Storage (deep-think Ops P0: бэкапов не было вообще).
# pg_dump гоняется в postgres-контейнере на VM (не нужен postgres-client на хосте),
# заливается в бакет через aws-cli с уже имеющимися на VM S3-ключами (.env.prod).
#
# 🔴 УРОК АУДИТА 2026-07-31 (P0 «зелёный пустой бэкап»): внешний `set -o pipefail`
# НЕ действует внутри `docker run bash -c "...|gzip"` — код возврата брался от gzip,
# поэтому упавший pg_dump (протухший пароль, недоступный пулер, mismatch версий)
# давал пустой .gz, «успешный» лог и уехавший в S3 мусор. Теперь: pipefail внутри
# контейнера + проверка целостности архива, размера и маркера конца дампа + алерт
# в Telegram при любом провале. Клиент postgres:17 (был :16 — старше сервера
# pg_dump отказывает «server version mismatch»).
# Восстановление проверяется отдельным workflow restore-drill.yml (еженедельно).
name: Backup DB

on:
  schedule:
    - cron: "0 1 * * *" # каждый день 01:00 UTC
  workflow_dispatch: {}

concurrency:
  group: backup-db
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: pg_dump → Object Storage (на VM)
        id: dump
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd /opt/reportagepost
            # DATABASE_URL и S3-ключи лежат в .env.prod (Lockbox)
            export $(grep -E '^(DATABASE_URL|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|S3_ENDPOINT|S3_BUCKET)=' .env.prod | xargs -d '\n')
            TS=$(date -u +%Y%m%d-%H%M%S)
            FILE="rp-db-${TS}.sql.gz"
            echo "Дамп → ${FILE}"
            # CA для verify-full нет в контейнере postgres:16 → для дампа по внутренней
            # сети VM→Managed PG понижаем до sslmode=require (шифрование без проверки CA).
            DUMP_URL=$(echo "$DATABASE_URL" | sed -E 's/sslmode=verify-full/sslmode=require/; s/&sslrootcert=[^&]*//; s/\?sslrootcert=[^&]*&/?/')
            # pipefail ВНУТРИ контейнера: иначе код возврата = gzip (всегда 0) и
            # упавший pg_dump уезжает в S3 пустышкой под видом успеха (аудит P0).
            docker run --rm -v /opt/reportagepost:/work postgres:17 \
              bash -c "set -o pipefail; pg_dump \"\$0\" --no-owner --no-privileges | gzip > /work/${FILE}" "$DUMP_URL"

            # Проверки годности дампа ДО заливки.
            #
            # 🔴 ГРАБЛЯ SIGPIPE (стоила трёх прогонов): `zcat file | grep -q ...`
            # под `set -o pipefail` — ловушка. grep -q выходит после ПЕРВОГО
            # совпадения и закрывает канал, zcat не успевает дописать
            # распакованный поток (он в разы больше буфера канала), падает с
            # SIGPIPE, и pipefail объявляет весь конвейер неуспешным — с кодом
            # 141. То есть проверка НАХОДИЛА таблицу и тут же рапортовала, что
            # не нашла. Поэтому здесь везде считаем в переменную (grep -c и awk
            # дочитывают вход до конца) и НИГДЕ не обрываем чтение через -q/head.
            SIZE=$(stat -c %s "/opt/reportagepost/${FILE}")
            echo "Размер архива: ${SIZE} байт"
            gzip -t "/opt/reportagepost/${FILE}" || { echo "❌ архив повреждён"; exit 1; }
            # Порог только против ПУСТОГО файла: абсолютный размер зависит от
            # объёма базы и уже давал ложный провал (18КБ при схеме 6КБ).
            [ "$SIZE" -ge 4096 ] || { echo "❌ архив пуст (<4KB)"; exit 1; }

            DUMP=/opt/reportagepost/dump-check.sql
            zcat "/opt/reportagepost/${FILE}" > "$DUMP"
            trap 'rm -f "$DUMP"' EXIT

            grep -c "PostgreSQL database dump complete" "$DUMP" >/dev/null \
              || { echo "❌ нет маркера конца дампа — дамп оборван"; exit 1; }

            TABLES=$(grep -cE 'CREATE TABLE .*"User"' "$DUMP" || true)
            if [ "$TABLES" -lt 1 ]; then
              echo "❌ в дампе не найдено объявление таблицы User. Что есть:"
              grep -E '^(CREATE TABLE|COPY) ' "$DUMP" | head -40 || true
              exit 1
            fi

            # ДАННЫЕ, а не только схема: строки между «COPY … "User" …» и
            # терминатором. Ловит и «выгружена только схема», и обрыв COPY.
            USER_ROWS=$(awk '/^COPY .*"User" /{f=1;next} f&&/^\\\.$/{f=0} f{c++} END{print c+0}' "$DUMP")
            echo "Таблиц User в дампе: ${TABLES}, строк пользователей: ${USER_ROWS}"
            if [ "$USER_ROWS" -lt 1 ]; then
              echo "❌ в дампе нет ни одной строки пользователей:"
              grep -E '^COPY ' "$DUMP" | head -40 || true
              exit 1
            fi
            rm -f "$DUMP"
            echo "✅ дамп прошёл проверки (целостность, структура, наличие данных)"

            echo "Заливка в s3://${S3_BUCKET}/db-backups/${FILE}"
            docker run --rm -v /opt/reportagepost:/work \
              -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" -e AWS_DEFAULT_REGION=ru-central1 \
              amazon/aws-cli --endpoint-url "$S3_ENDPOINT" \
              s3 cp "/work/${FILE}" "s3://${S3_BUCKET}/db-backups/${FILE}"
            rm -f "/opt/reportagepost/${FILE}"
            # Ретеншн: оставить 14 последних дампов
            docker run --rm \
              -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
              -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" -e AWS_DEFAULT_REGION=ru-central1 \
              amazon/aws-cli --endpoint-url "$S3_ENDPOINT" \
              s3 ls "s3://${S3_BUCKET}/db-backups/" | sort | head -n -14 | awk '{print $4}' | while read -r old; do
                [ -n "$old" ] && docker run --rm -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" -e AWS_DEFAULT_REGION=ru-central1 amazon/aws-cli --endpoint-url "$S3_ENDPOINT" s3 rm "s3://${S3_BUCKET}/db-backups/${old}" || true
              done
            echo "Бэкап готов: ${FILE}"

            # ── Фотографии пользователей (аудит 2026-07-31, P1) ──────────────
            # Бэкап покрывал ТОЛЬКО базу, а портфолио — это и есть продукт:
            # восстановленная БД со ссылками на исчезнувшие объекты = потерянная
            # бета. Плюс код активно удаляет объекты (чистка при удалении фото и
            # аккаунта), т.е. баг или скомпрометированный ключ выносят портфолио
            # всех участников. Синхронизируем в ОТДЕЛЬНЫЙ бакет — тот же бакет
            # защитой не является (там же лежат дампы БД).
            #
            # Включается сам, когда оператор заведёт S3_BACKUP_BUCKET в Lockbox.
            BACKUP_BUCKET=$(grep -E '^S3_BACKUP_BUCKET=' .env.prod | cut -d= -f2- || true)
            if [ -n "${BACKUP_BUCKET:-}" ]; then
              echo "Синхронизация медиа → s3://${BACKUP_BUCKET}/media/"
              docker run --rm \
                -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
                -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" -e AWS_DEFAULT_REGION=ru-central1 \
                amazon/aws-cli --endpoint-url "$S3_ENDPOINT" \
                s3 sync "s3://${S3_BUCKET}/photos/" "s3://${BACKUP_BUCKET}/media/photos/" --only-show-errors
              docker run --rm \
                -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY_ID" \
                -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_ACCESS_KEY" -e AWS_DEFAULT_REGION=ru-central1 \
                amazon/aws-cli --endpoint-url "$S3_ENDPOINT" \
                s3 sync "s3://${S3_BUCKET}/videos/" "s3://${BACKUP_BUCKET}/media/videos/" --only-show-errors || true
              echo "Медиа синхронизированы"
            else
              echo "⚠️ S3_BACKUP_BUCKET не задан — ФОТОГРАФИИ НЕ БЭКАПЯТСЯ (только БД)"
            fi

      # Отметка о прогоне В САМОЙ платформе. Бэкап выполняется здесь, снаружи,
      # поэтому /health и панель администратора о нём не знали ничего и годами
      # показывали бы «никогда не запускался» при пяти успешных прогонах подряд.
      # Ложная тревога хуже отсутствия мониторинга: настоящая поломка уже не
      # изменила бы показатель.
      - name: Отметить прогон в платформе
        if: success()
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -uo pipefail
            cd /opt/reportagepost
            SECRET=$(grep -E '^JOBS_SECRET=' .env.prod | cut -d= -f2-)
            [ -z "${SECRET:-}" ] && { echo "JOBS_SECRET не задан — отметка пропущена"; exit 0; }
            curl -sf -m 20 -X POST http://127.0.0.1:3000/api/jobs/heartbeat \
              -H "Authorization: Bearer $SECRET" -H 'Content-Type: application/json' \
              -d '{"name":"backup","ok":true}' >/dev/null && echo "отметка записана"

      # Провал бэкапа обязан будить оператора: раньше падение было видно только
      # красным значком в Actions, на который никто не смотрит ночью (аудит P1).
      - name: Telegram-алерт при провале бэкапа
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
        run: |
          set -uo pipefail
          if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
            curl -s -m 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TG_CHAT}" \
              --data-urlencode "text=🔴 Reportage Post: НОЧНОЙ БЭКАП БД ПРОВАЛИЛСЯ. Лог: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null || true
          else
            echo "TG-секреты не заданы — алерт не отправлен"
          fi
