name: Promote admin
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email существующего пользователя → ADMIN"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Promote on prod
        uses: appleboy/ssh-action@v1.0.3
        env:
          EMAIL: ${{ inputs.email }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: EMAIL
          script: docker exec reportagepost npx tsx scripts/promote-admin.ts "$EMAIL"
