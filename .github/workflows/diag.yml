name: Prod diag
on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Auth flow check on prod
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            # hairpin NAT: свой публичный IP изнутри недоступен — ходим на localhost
            B="http://127.0.0.1:$(/usr/local/bin/rp-port.sh 2>/dev/null || echo 3000)"
            EMAIL="diag-$RANDOM@test.local"
            echo "--- register:"
            curl -si -c /tmp/cj -X POST "$B/api/auth/register" \
              -H 'Content-Type: application/json' \
            echo "--- cabinet with cookie:"
            curl -s -o /dev/null -w '%{http_code}\n' -b /tmp/cj "$B/ru/cabinet"
            echo "--- login:"
            curl -si -c /tmp/cj2 -X POST "$B/api/auth/login" \
              -H 'Content-Type: application/json' \
              -d "{\"email\":\"$EMAIL\",\"password\":\"diag-password-42\"}" | grep -iE '^HTTP|set-cookie' || true
            echo "--- cabinet after login:"
            curl -s -o /dev/null -w '%{http_code}\n' -b /tmp/cj2 "$B/ru/cabinet"
            echo "--- СОЗДАНИЕ АНКЕТЫ (сессия фотографа из шага register выше):"
            PROF=$(curl -s -w '\nHTTP:%{http_code}' -b /tmp/cj -X POST "$B/api/profile" \
              -H 'Content-Type: application/json' \
              -d '{"username":"diag'"$RANDOM"'","citySlug":"moscow","categorySlugs":["concerts-festivals"],"bio":"Тест анкеты фотографа для диагностики","packages":[{"hours":3,"priceMinor":1500000,"currency":"RUB"}]}')
            echo "profile response: $PROF"
            echo "--- РЕЖИМ ХРАНИЛИЩА (S3 vs диск):"
            docker exec reportagepost sh -c 'if [ -n "$S3_BUCKET" ]; then echo "S3 включён, бакет=$S3_BUCKET"; else echo "ВНИМАНИЕ: S3 не сконфигурирован — фото на диске"; fi'
            docker exec reportagepost sh -c 'ls /app/.uploads >/dev/null 2>&1 && echo "есть /app/.uploads (фото писались на диск!)" || echo "нет /app/.uploads (хорошо, всё в S3)"'
