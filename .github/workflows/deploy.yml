name: CI/CD
on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rp
          POSTGRES_PASSWORD: rp_ci
          POSTGRES_DB: reportagepost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rp:rp_ci@localhost:5432/reportagepost
      AUTH_SECRET: ci-secret-32-chars-minimum-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Миграции ПЕРЕД тестами (паттерн Verifi)
      - run: npx prisma migrate deploy && npx prisma generate
      - run: npm run db:seed
      - run: npm test
      - run: npm run e2e # e2e-батарея (S2-критерий): полный цикл + петля доверия на чистом PG
      - run: npm run build

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "deploy/*"
          target: /home/rp/deploy-staging
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE,GHCR_TOKEN,GHCR_USER
          script_stop: true
          script: |
            # ВОССТАНОВЛЕНИЕ ПРИ ПЕРЕПОЛНЕНИИ ДИСКА (инцидент 2026-07-24: диск 30GB
            # переполнился Docker-образами/логами → прод лёг). Освобождаем место
            # ПЕРВЫМ делом, ДО записи конфигов/секретов (иначе script_stop оборвёт
            # на full-disk). Файловые операции (без docker) первыми — освобождают
            # место, чтобы docker-демон ожил, затем docker prune.
            echo "=== disk before ==="; df -h / || true
            sudo journalctl --vacuum-size=80M 2>/dev/null || true
            sudo find /var/lib/docker/containers -name '*-json.log' -exec truncate -s 0 {} \; 2>/dev/null || true
            sudo find /var/log -type f -name '*.gz' -delete 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true
            docker system prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            echo "=== disk after cleanup ==="; df -h / || true
            # ФС могла не вырасти до 60ГБ-диска после resize (нужны growpart+resize2fs) —
            # тогда деплои падают на нехватке места, а cleanup это не лечит. Растим ФС
            # под диск, идемпотентно и безопасно (no-op если уже выросла).
            sudo apt-get install -y cloud-guest-utils 2>/dev/null || true
            ROOTDEV=$(findmnt -n -o SOURCE / 2>/dev/null); DISKN=$(lsblk -no PKNAME "$ROOTDEV" 2>/dev/null | head -1); PARTN=$(echo "$ROOTDEV" | grep -oE '[0-9]+$')
            [ -n "$DISKN" ] && [ -n "$PARTN" ] && sudo growpart "/dev/$DISKN" "$PARTN" 2>/dev/null || true
            sudo resize2fs "$ROOTDEV" 2>/dev/null || true
            echo "=== disk after growpart ==="; df -h / || true
            sudo mkdir -p /opt/reportagepost && sudo chown rp:rp /opt/reportagepost
            cp /home/rp/deploy-staging/* /opt/reportagepost/
            cd /opt/reportagepost
            chmod +x setup-server.sh fetch-secrets.sh
            ./setup-server.sh
            ./fetch-secrets.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # S3-хелпер для диагностики (Actions-логи агенту недоступны, PAT 403 —
            # но S3 он читает через yc). Ранний слив состояния диска ДО pull.
            S3ID=$(grep '^S3_ACCESS_KEY_ID=' .env.prod | cut -d= -f2-); S3KEY=$(grep '^S3_SECRET_ACCESS_KEY=' .env.prod | cut -d= -f2-)
            S3EP=$(grep '^S3_ENDPOINT=' .env.prod | cut -d= -f2-); S3B=$(grep '^S3_BUCKET=' .env.prod | cut -d= -f2-)
            s3put() { docker run --rm -v /tmp:/w -e AWS_ACCESS_KEY_ID="$S3ID" -e AWS_SECRET_ACCESS_KEY="$S3KEY" amazon/aws-cli --endpoint-url "$S3EP" s3 cp "/w/$1" "s3://$S3B/_diag/$2" >/dev/null 2>&1 || true; }
            { echo "== SHA ${IMAGE##*:} =="; echo "== df =="; df -h /; echo; echo "== lsblk =="; lsblk 2>/dev/null; echo; echo "== docker system df =="; docker system df; } > /tmp/predeploy.txt 2>&1 || true
            s3put predeploy.txt predeploy.txt
            # .previous-deploy для отката (паттерн Verifi)
            [ -f .deploy.env ] && cp .deploy.env .previous-deploy || true
            echo "IMAGE=$IMAGE" > .deploy.env
            docker pull "$IMAGE"
            IMAGE="$IMAGE" docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
            # health-check с ожиданием (миграции на старте)
            for i in $(seq 1 20); do
              sleep 6
              if curl -sf http://127.0.0.1:3000/health >/dev/null; then
                echo "HEALTH OK"
                # КОРЕНЬ ИНЦИДЕНТА 2026-07-24: prune раньше шёл ДО up (заменяемый образ
                # был «в использовании» → не удалялся) + exit 0 сразу. За 17 деплоев
                # образы Next.js (~1.5ГБ) накопились → диск забит. ФИКС: чистим образы
                # ПОСЛЕ успешного up — на диске остаётся только рабочий (откат re-pull'ит).
                docker image prune -af >/dev/null 2>&1 || true
                # Диагностика диска → в бакет (Actions-логи агенту недоступны, PAT 403)
                { echo "== df =="; df -h /; echo; echo "== docker system df =="; docker system df; \
                  echo; echo "== du (top dirs) =="; sudo du -sh /var/lib/docker /var/log /var/log/journal /opt/reportagepost 2>/dev/null; \
                  echo; echo "== docker images =="; docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'; } > /tmp/diskdiag.txt 2>&1 || true
                S3ID=$(grep '^S3_ACCESS_KEY_ID=' .env.prod | cut -d= -f2-); S3KEY=$(grep '^S3_SECRET_ACCESS_KEY=' .env.prod | cut -d= -f2-)
                S3EP=$(grep '^S3_ENDPOINT=' .env.prod | cut -d= -f2-); S3B=$(grep '^S3_BUCKET=' .env.prod | cut -d= -f2-)
                docker run --rm -v /tmp:/w -e AWS_ACCESS_KEY_ID="$S3ID" -e AWS_SECRET_ACCESS_KEY="$S3KEY" \
                  amazon/aws-cli --endpoint-url "$S3EP" s3 cp /w/diskdiag.txt "s3://$S3B/_diag/diskdiag.txt" >/dev/null 2>&1 || true
                exit 0
              fi
            done
            # АВТО-ОТКАТ (deep-think Ops P0): при провале health поднимаем прошлый
            # образ из .previous-deploy, чтобы прод не остался на битом. Безопасно,
            # т.к. миграции — expand-contract (аддитивны, совместимы с прошлым образом).
            echo "HEALTH FAILED — сбор логов в S3 + авто-откат на .previous-deploy"
            { echo "== SHA ${IMAGE##*:} =="; echo "== df =="; df -h /; echo; echo "== docker ps -a =="; docker ps -a; echo; echo "== docker compose logs (tail) =="; IMAGE="$IMAGE" docker compose --env-file .env.prod -f docker-compose.prod.yml logs --tail 100 2>&1; } > /tmp/healthfail.txt 2>&1 || true
            s3put healthfail.txt healthfail.txt
            if [ -f .previous-deploy ]; then
              PREV_IMAGE=$(grep -oE 'IMAGE=.*' .previous-deploy | cut -d= -f2-)
              if [ -n "$PREV_IMAGE" ]; then
                echo "Откат на $PREV_IMAGE"
                docker pull "$PREV_IMAGE" || true
                IMAGE="$PREV_IMAGE" docker compose --env-file .env.prod -f docker-compose.prod.yml up -d
                cp .previous-deploy .deploy.env
                for i in $(seq 1 20); do
                  sleep 6
                  if curl -sf http://127.0.0.1:3000/health >/dev/null; then echo "ОТКАТ OK — прод на прошлом образе"; break; fi
                done
              fi
            fi
            echo "Деплой провалил health — откат выполнен (если был прошлый образ)"; exit 1
