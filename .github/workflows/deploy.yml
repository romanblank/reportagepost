name: CI/CD
on:
  push:
    branches: [main]
    # Правки только доков/заметок не должны гонять полный build+deploy
    # (экономия минут Actions — важно на private-плане). Смешанные пуши
    # (код + доки) деплоятся как обычно.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch: {}

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: rp
          POSTGRES_PASSWORD: rp_ci
          POSTGRES_DB: reportagepost
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rp" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://rp:rp_ci@localhost:5432/reportagepost
      AUTH_SECRET: ci-secret-32-chars-minimum-000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # Миграции ПЕРЕД тестами (паттерн Verifi)
      - run: npx prisma migrate deploy && npx prisma generate
      - run: npm run db:seed
      # Lint и тайпчек в CI (аудит 2026-08-01, P2): раньше качество кода
      # держалось только на локальном prepare-deploy — то есть на памяти
      # разработчика. Пуш в обход гейта проходил незамеченным, а ошибки типов
      # в tests/ не ловились вообще (next build проверяет лишь бандл).
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run e2e # e2e-батарея (S2-критерий): полный цикл + петля доверия на чистом PG
      - run: npm run build

  build-push:
    needs: test
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            APP_VERSION=${{ github.sha }}
          # GHA layer-кэш: неизменные слои (base, npm ci при том же lock) переиспользуются
          # между ранами — Docker больше не пересобирает всё с нуля каждый пуш.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy deploy files to VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          source: "deploy/*"
          target: /home/rp/deploy-staging
          strip_components: 1
      - name: Deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ needs.build-push.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE,GHCR_TOKEN,GHCR_USER
          script_stop: true
          # Дефолт command_timeout ssh-action = 10m; при медленном/зависшем pull
          # образа GHCR→VM его не хватало (деплой fa6f201 упал на «Run Command
          # Timeout» посреди pull, 2026-07-30). 20m — запас на pull + migrate + старт.
          command_timeout: 20m
          script: |
            # ВОССТАНОВЛЕНИЕ ПРИ ПЕРЕПОЛНЕНИИ ДИСКА (инцидент 2026-07-24: диск 30GB
            # переполнился Docker-образами/логами → прод лёг). Освобождаем место
            # ПЕРВЫМ делом, ДО записи конфигов/секретов (иначе script_stop оборвёт
            # на full-disk). Файловые операции (без docker) первыми — освобождают
            # место, чтобы docker-демон ожил, затем docker prune.
            echo "=== disk before ==="; df -h / || true
            sudo journalctl --vacuum-size=80M 2>/dev/null || true
            sudo find /var/lib/docker/containers -name '*-json.log' -exec truncate -s 0 {} \; 2>/dev/null || true
            sudo find /var/log -type f -name '*.gz' -delete 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true
            docker system prune -af 2>/dev/null || true
            docker builder prune -af 2>/dev/null || true
            echo "=== disk after cleanup ==="; df -h / || true
            # ФС могла не вырасти до 60ГБ-диска после resize (нужны growpart+resize2fs) —
            # тогда деплои падают на нехватке места, а cleanup это не лечит. Растим ФС
            # под диск, идемпотентно и безопасно (no-op если уже выросла).
            sudo apt-get install -y cloud-guest-utils 2>/dev/null || true
            ROOTDEV=$(findmnt -n -o SOURCE / 2>/dev/null); DISKN=$(lsblk -no PKNAME "$ROOTDEV" 2>/dev/null | head -1); PARTN=$(echo "$ROOTDEV" | grep -oE '[0-9]+$')
            [ -n "$DISKN" ] && [ -n "$PARTN" ] && sudo growpart "/dev/$DISKN" "$PARTN" 2>/dev/null || true
            sudo resize2fs "$ROOTDEV" 2>/dev/null || true
            echo "=== disk after growpart ==="; df -h / || true
            sudo mkdir -p /opt/reportagepost && sudo chown rp:rp /opt/reportagepost
            cp /home/rp/deploy-staging/* /opt/reportagepost/
            cd /opt/reportagepost
            chmod +x setup-server.sh fetch-secrets.sh smoke.sh
            ./setup-server.sh
            ./fetch-secrets.sh
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            # S3-хелпер для диагностики (Actions-логи агенту недоступны, PAT 403 —
            # но S3 он читает через yc). Ранний слив состояния диска ДО pull.
            S3ID=$(grep '^S3_ACCESS_KEY_ID=' .env.prod | cut -d= -f2-); S3KEY=$(grep '^S3_SECRET_ACCESS_KEY=' .env.prod | cut -d= -f2-)
            S3EP=$(grep '^S3_ENDPOINT=' .env.prod | cut -d= -f2-); S3B=$(grep '^S3_BUCKET=' .env.prod | cut -d= -f2-)
            s3put() { docker run --rm -v /tmp:/w -e AWS_ACCESS_KEY_ID="$S3ID" -e AWS_SECRET_ACCESS_KEY="$S3KEY" amazon/aws-cli --endpoint-url "$S3EP" s3 cp "/w/$1" "s3://$S3B/_diag/$2" >/dev/null 2>&1 || true; }
            { echo "== SHA ${IMAGE##*:} =="; echo "== df =="; df -h /; echo; echo "== lsblk =="; lsblk 2>/dev/null; echo; echo "== docker system df =="; docker system df; } > /tmp/predeploy.txt 2>&1 || true
            s3put predeploy.txt predeploy.txt
            # .previous-deploy для отката (паттерн Verifi)
            [ -f .deploy.env ] && cp .deploy.env .previous-deploy || true
            echo "IMAGE=$IMAGE" > .deploy.env
            docker pull "$IMAGE"

            # Миграции и сид — ОТДЕЛЬНЫМ шагом до подъёма (аудит 2026-08-01):
            # так их не ограничивает health-таймаут и не обрывает авто-откат.
            # Упали — деплой останавливается здесь, прод остаётся на прежней
            # версии целым; это лучше, чем полуприменённая схема.
            echo "Миграции и сид…"
            docker run --rm --env-file .env.prod "$IMAGE" \
              sh -c 'npx prisma migrate deploy && npm run db:seed'

            # ── BLUE-GREEN (аудит 2026-08-16, P1 №5) ──────────────────────
            # Раньше `up -d` подменял единственный контейнер: 20-40с даунтайма
            # на каждый релиз и 2-3 минуты при откате — ровно тогда, когда всё
            # плохо. Теперь новый цвет поднимается РЯДОМ, nginx переключает
            # upstream после health, старый живёт до успешного smoke: откат —
            # это переключение обратно, мгновенное и без re-pull.
            export COMPOSE_IGNORE_ORPHANS=1
            ACTIVE=$(cat .active-color 2>/dev/null || echo none)
            if [ "$ACTIVE" = "blue" ]; then NEW=green; NEW_PORT=3002; OLD_CONT=reportagepost-blue
            else NEW=blue; NEW_PORT=3001; OLD_CONT=reportagepost-green; fi
            echo "Активен: $ACTIVE → поднимаем $NEW на :$NEW_PORT"

            COLOR="$NEW" APP_PORT="$NEW_PORT" IMAGE="$IMAGE"               docker compose --env-file .env.prod -f docker-compose.prod.yml -p "rp-$NEW" up -d app

            switch_upstream() {
              echo "upstream rp_upstream { server 127.0.0.1:$1; }" | sudo tee /etc/nginx/conf.d/rp-upstream.conf >/dev/null
              sudo nginx -t && sudo systemctl reload nginx
            }

            DEPLOY_OK=0
            for i in $(seq 1 20); do
              sleep 6
              if curl -sf "http://127.0.0.1:$NEW_PORT/health" >/dev/null; then
                echo "HEALTH OK на новом цвете — переключаем трафик"
                switch_upstream "$NEW_PORT"
                echo "$NEW" > .active-color
                # Smoke по НАСТОЯЩЕМУ домену: /health трогает только базу и
                # отвечает 200 даже при падающем каталоге
                if ./smoke.sh; then
                  DEPLOY_OK=1
                else
                  echo "SMOKE ПРОВАЛЕН — мгновенный откат upstream"
                fi
                break
              fi
            done

            if [ "$DEPLOY_OK" = "1" ]; then
              # Старый цвет и легаси-контейнер гасим ТОЛЬКО после успеха
              docker rm -f "$OLD_CONT" reportagepost >/dev/null 2>&1 || true
              # Воркер транскода — на новый образ (свой проект, чтобы не
              # конфликтовать по именам между цветами)
              IMAGE="$IMAGE" docker compose --env-file .env.prod -f docker-compose.prod.yml -p rp-worker up -d worker
              # Чистка образов ПОСЛЕ успеха: остаются текущий и предыдущий —
              # откат не должен зависеть от доступности GHCR (урок 2026-07-24)
              PREV_IMG=$(grep -E '^IMAGE=' .previous-deploy 2>/dev/null | cut -d= -f2-)
              docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' \
                | grep -F "$(echo "$IMAGE" | cut -d: -f1)" \
                | grep -v -F "$IMAGE" \
                | { [ -n "$PREV_IMG" ] && grep -v -F "$PREV_IMG" || cat; } \
                | awk '{print $2}' | xargs -r docker rmi -f >/dev/null 2>&1 || true
              docker image prune -f >/dev/null 2>&1 || true
              { echo "== df =="; df -h /; echo; echo "== docker system df =="; docker system df; \
                echo; echo "== docker images =="; docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'; } > /tmp/diskdiag.txt 2>&1 || true
              s3put diskdiag.txt diskdiag.txt
              exit 0
            fi

            # ── ОТКАТ ─────────────────────────────────────────────────────────
            # Старый цвет всё ещё работает: возвращаем на него трафик и гасим
            # неудавшийся новый. Ни секунды даунтайма, ни одного re-pull.
            echo "ОТКАТ: возвращаем upstream на прежний цвет"
            { echo "== SHA ${IMAGE##*:} =="; echo "== df =="; df -h /; echo; echo "== docker ps -a =="; docker ps -a; echo; \
              echo "== логи нового цвета =="; docker logs "reportagepost-$NEW" --tail 100 2>&1; } > /tmp/healthfail.txt 2>&1 || true
            s3put healthfail.txt healthfail.txt
            case "$ACTIVE" in
              blue)  switch_upstream 3001; echo blue > .active-color ;;
              green) switch_upstream 3002; echo green > .active-color ;;
              *)     switch_upstream 3000 ;; # легаси-контейнер ещё на 3000
            esac
            docker rm -f "reportagepost-$NEW" >/dev/null 2>&1 || true
            cp .previous-deploy .deploy.env 2>/dev/null || true
            echo "Деплой провалил health — откат выполнен (если был прошлый образ)"; exit 1
