name: Create invite
on:
  workflow_dispatch:
    inputs:
      note:
        description: "Кому выдан"
        required: true
      max_uses:
        description: "Сколько использований"
        required: true
        default: "1"

jobs:
  invite:
    runs-on: ubuntu-latest
    steps:
      - name: Create invite on prod
        uses: appleboy/ssh-action@v1.0.3
        env:
          NOTE: ${{ inputs.note }}
          MAX_USES: ${{ inputs.max_uses }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: NOTE,MAX_USES
          script: |
            docker exec reportagepost npx tsx scripts/create-invite.ts "$NOTE" "$MAX_USES"
