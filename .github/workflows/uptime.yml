# Внешний аптайм-пробинг прода → Telegram-алерт оператору (deep-think Ops P0:
# прод падал без единого алерта). Пингуем снаружи (GitHub Actions) — ловит и
# полную смерть VM, и db-fail, и протухший SSL.
#
# ⚠️ ТРЕБУЕТ СЕКРЕТОВ (оператор добавляет в GitHub → Settings → Secrets):
#   TELEGRAM_BOT_TOKEN     — токен бота (тот же, что в Lockbox)
#   TELEGRAM_ALERT_CHAT_ID — chat_id оператора для алертов
# Без секретов job молча пропускает отправку (safe no-op).
name: Uptime

on:
  schedule:
    - cron: "*/10 * * * *" # каждые 10 минут
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Пинг /health + SSL, алерт при проблеме
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_ALERT_CHAT_ID }}
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
        run: |
          set -uo pipefail
          URL="https://reportagepost.com/health"
          alert() {
            echo "ALERT: $1"
            if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
              curl -s -m 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TG_CHAT}" \
                --data-urlencode "text=🔴 Reportage Post: $1" >/dev/null || true
            fi
            exit 1
          }
          # 1. HTTP + тело
          # Одна повторная попытка: сетевой сбой раннера GitHub не должен
          # выглядеть как падение прода — иначе канал наполняется ложными
          # тревогами и его перестают читать
          BODY=$(curl -s -m 20 -w "\n%{http_code}" "$URL") || { sleep 20; BODY=$(curl -s -m 20 -w "\n%{http_code}" "$URL") || alert "сайт недоступен (две попытки)"; }
          CODE=$(echo "$BODY" | tail -1)
          JSON=$(echo "$BODY" | sed '$d')
          [ "$CODE" = "200" ] || alert "HTTP ${CODE} на /health"
          echo "$JSON" | grep -q '"db":"ok"' || alert "БД недоступна (health: ${JSON})"
          # Хранилище: при его отказе сайт рендерится, но все фотографии битые —
          # без этой проверки о таком узнавал первый пользователь
          echo "$JSON" | grep -q '"storage":"ok"' || alert "хранилище недоступно (health: ${JSON})"
          # 2. SSL: предупредить, если ≤14 дней до истечения
          END=$(echo | openssl s_client -servername reportagepost.com -connect reportagepost.com:443 2>/dev/null | openssl x509 -noout -enddate 2>/dev/null | cut -d= -f2)
          if [ -n "$END" ]; then
            END_TS=$(date -d "$END" +%s 2>/dev/null || echo 0)
            NOW_TS=$(date +%s)
            DAYS=$(( (END_TS - NOW_TS) / 86400 ))
            # Предупреждение, а не авария: раньше оно уходило КАЖДЫЕ 10 минут
            # в течение двух недель — две тысячи одинаковых красных сообщений
            # вперемешку с настоящими падениями. Теперь только на рубежах и
            # спокойным тоном, без падения самой проверки.
            case "$DAYS" in
              14|7|3|2|1|0)
                if [ -n "${TG_TOKEN:-}" ] && [ -n "${TG_CHAT:-}" ]; then
                  curl -s -m 15 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
                    --data-urlencode "chat_id=${TG_CHAT}" \
                    --data-urlencode "text=⚠️ Reportage Post: сертификат истекает через ${DAYS} дн." >/dev/null || true
                fi
                ;;
            esac
          fi
          # Отметка пробы В ПЛАТФОРМЕ: молчание uptime (квота Actions,
          # отключение scheduled, сбой раннеров) иначе неотличимо от «всё
          # хорошо». Без JOBS_SECRET в секретах репо — предупреждение, и
          # /health честно держит uptime: never, пока оператор не заведёт
          if [ -n "${JOBS_SECRET:-}" ]; then
            curl -s -m 15 -X POST "${URL%/health}/api/jobs/heartbeat" \
              -H "Authorization: Bearer ${JOBS_SECRET}" -H 'Content-Type: application/json' \
              -d '{"name":"uptime","ok":true}' >/dev/null || true
          else
            echo "JOBS_SECRET не задан — отметка uptime не пишется"
          fi
          echo "OK: ${JSON}"
