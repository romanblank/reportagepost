name: Reset password
on:
  workflow_dispatch:
    inputs:
      email:
        description: "Email пользователя"
        required: true

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset on prod
        uses: appleboy/ssh-action@v1.0.3
        env:
          EMAIL: ${{ inputs.email }}
        with:
          host: ${{ secrets.PROD_HOST }}
          username: rp
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: EMAIL
          script: |
            docker exec reportagepost npx tsx scripts/reset-password.ts "$EMAIL"
